<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200">
    <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8; }
        .title { font: bold 16px "Segoe UI", Ubuntu, sans-serif; fill: #00ff88; }
    </style>
    <rect width="448" height="198" x="1" y="1" class="bg"/>
    <text x="25" y="35" class="title">Most Used Languages</text>
    
    <!-- Progress Bar -->
    <g rx="5" clip-path="url(#bar-clip)">
        <clipPath id="bar-clip">
            <rect x="25" y="65" width="400" height="10" rx="5" />
        </clipPath>
        <rect x="25.0" y="65" width="274.5" height="10" fill="#3178c6" /><rect x="299.5" y="65" width="37.1" height="10" fill="#663399" /><rect x="336.6" y="65" width="36.9" height="10" fill="#3572A5" /><rect x="373.6" y="65" width="21.4" height="10" fill="#f1e05a" /><rect x="394.9" y="65" width="15.9" height="10" fill="#e34c26" />
    </g>
    
    <!-- Legend -->
    
            <circle cx="25" cy="100" r="6" fill="#3178c6" />
            <text x="40" y="105" font-family="Segoe UI, Ubuntu" font-size="13" fill="#ffffff">TypeScript (68.6%)</text>
        
            <circle cx="225" cy="100" r="6" fill="#663399" />
            <text x="240" y="105" font-family="Segoe UI, Ubuntu" font-size="13" fill="#ffffff">CSS (9.3%)</text>
        
            <circle cx="25" cy="125" r="6" fill="#3572A5" />
            <text x="40" y="130" font-family="Segoe UI, Ubuntu" font-size="13" fill="#ffffff">Python (9.2%)</text>
        
            <circle cx="225" cy="125" r="6" fill="#f1e05a" />
            <text x="240" y="130" font-family="Segoe UI, Ubuntu" font-size="13" fill="#ffffff">JavaScript (5.3%)</text>
        
            <circle cx="25" cy="150" r="6" fill="#e34c26" />
            <text x="40" y="155" font-family="Segoe UI, Ubuntu" font-size="13" fill="#ffffff">HTML (4.0%)</text>
        
</svg>