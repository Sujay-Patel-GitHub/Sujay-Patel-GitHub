name: Auto Update Custom Stats Cards

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Stats Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_my_stats.py

      - name: Fetch Trophies from cybee mirror
        run: |
          curl -s -o profile-assets/trophies.svg "https://trophygithubreadmelang.cybee.dpdns.org/?username=Sujay-Patel-GitHub&theme=juicyfresh&no-frame=true&row=1&column=7&margin-w=8"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-assets/
          git commit -m "Auto-update profile stats cards and trophies" || exit 0
          git push origin main
